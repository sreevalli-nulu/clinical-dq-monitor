# Render "Blueprint": tells Render how to build and run the app. See README.md > Deploy.
services:
  - type: web
    name: clinical-dq-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn src.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
